name: lobe-chat-database
services:
  logto:
    image: svhd/logto
    container_name: lobe-logto
    expose:
      - '${LOGTO_PORT}' # Logto
      - '3002' # Logto Admin
    networks:
      - lobe-network
      - npm_proxy
    environment:
      - 'TRUST_PROXY_HEADER=1'
      - 'PORT=${LOGTO_PORT}'
      - 'DB_URL=${DATABASE_URL}logto'
      - 'ENDPOINT=http://lobe-logto:${LOGTO_PORT}'
      - 'ADMIN_ENDPOINT=http://lobe-logto:3002'
    entrypoint: ['sh', '-c', 'npm run cli db seed -- --swe && npm start']

  lobe:
    build:
      context: ../../../
      dockerfile: Dockerfile.database
      args:
        USE_CN_MIRROR: "true"
    container_name: lobe-chat
    expose:
      - '3210' # LobeChat
    networks:
      - lobe-network
      - npm_proxy
    depends_on:
      logto:
        condition: service_started

    environment:
      - 'APP_URL=${APP_URL}'
      - 'NEXT_AUTH_SSO_PROVIDERS=${NEXT_AUTH_SSO_PROVIDERS}'
      - 'KEY_VAULTS_SECRET=${KEY_VAULTS_SECRET}'
      - 'NEXT_AUTH_SECRET=${NEXT_AUTH_SECRET}'
      - 'NEXTAUTH_URL=${NEXTAUTH_URL}'
      - 'DATABASE_URL=${DATABASE_URL}${LOBE_DB_NAME}'
      - 'S3_ENDPOINT=${S3_ENDPOINT}'
      - 'S3_BUCKET=${S3_BUCKET}'
      - 'S3_PUBLIC_DOMAIN=${S3_PUBLIC_DOMAIN}'
      - 'S3_ENABLE_PATH_STYLE=${S3_ENABLE_PATH_STYLE}'
      - 'S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}'
      - 'S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}'
      - 'S3_REGION=${S3_REGION}'
      - 'S3_SET_ACL=${S3_SET_ACL}'
      - 'NEXT_PUBLIC_SERVICE_MODE=server'
      - 'NEXT_PUBLIC_ENABLE_AUTH=${NEXT_PUBLIC_ENABLE_AUTH}'
      - 'NEXT_PUBLIC_REQUIRE_LOGIN=${NEXT_PUBLIC_REQUIRE_LOGIN}'
      - 'NEXT_PUBLIC_BRANDING_NAME=${NEXT_PUBLIC_BRANDING_NAME}'
      - 'NEXT_PUBLIC_BRANDING_LOGO_URL=${NEXT_PUBLIC_BRANDING_LOGO_URL}'
      - 'NEXT_PUBLIC_ORG_NAME=${NEXT_PUBLIC_ORG_NAME}'
      - 'NEXT_PUBLIC_OFFICIAL_URL=${NEXT_PUBLIC_OFFICIAL_URL}'
      - 'NEXT_PUBLIC_OFFICIAL_PREVIEW_URL=${NEXT_PUBLIC_OFFICIAL_PREVIEW_URL}'
      - 'NEXT_PUBLIC_OFFICIAL_SITE=${NEXT_PUBLIC_OFFICIAL_SITE}'
      - 'AUTH_LOGTO_ID=${AUTH_LOGTO_ID}'
      - 'AUTH_LOGTO_SECRET=${AUTH_LOGTO_SECRET}'
      - 'AUTH_LOGTO_ISSUER=${AUTH_LOGTO_ISSUER}'
      - 'FEATURE_FLAGS=${FEATURE_FLAGS}'
      - 'DEFAULT_FILES_CONFIG=${DEFAULT_FILES_CONFIG}'
      - 'SEARXNG_URL=${SEARXNG_URL}'
    env_file:
      - .env
    restart: always

networks:
  lobe-network:
    driver: bridge
  npm_proxy:
    external: true
